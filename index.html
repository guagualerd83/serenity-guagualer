<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock · Serenity Research</title><link rel="stylesheet" href="../style.css">
</head><body>
<main class="wrap">
<a class="back" href="../">← 返回</a>
<section class="stock-head">
 <div class="eyebrow">STOCK RESEARCH</div>
 <div class="stock-title"><div><h1 id="symbol">—</h1><div id="stance" class="sentiment"></div></div><div id="metrics" class="metrics"></div></div>
</section>

<details open><summary>價格與 Primary Signal</summary><div class="detail-body"><div id="chartMeta" class="small" style="margin-bottom:10px"></div><svg id="chart" class="chart" viewBox="0 0 1000 340" preserveAspectRatio="none"></svg><div class="small">綠：Bullish · 紅：Bearish · 灰褐：Mixed / Neutral。一天最多一個 Daily Net Stance。</div></div></details>
<details open><summary>核心觀點</summary><div class="detail-body grid2"><div><div class="eyebrow">LATEST THESIS</div><p id="thesis"></p></div><div><div class="eyebrow">TRACK RECORD</div><div id="performance"></div></div></div></details>
<details><summary>Primary posts</summary><div id="posts" class="detail-body"></div></details>
<details><summary>Supporting replies</summary><div id="replies" class="detail-body"></div></details>
</main>
<footer class="wrap footer">公開資訊彙整，不構成投資建議。</footer>
<script>
const esc=s=>(s??"").toString().replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const qs=new URLSearchParams(location.search), SYMBOL=(qs.get("symbol")||"").toUpperCase();
const PERIOD=["daily","weekly","monthly","quarterly"].includes(qs.get("period"))?qs.get("period"):"quarterly";
const PERIOD_DAYS={daily:1,weekly:7,monthly:28,quarterly:90};
const PERIOD_LABEL={daily:"每日",weekly:"每週",monthly:"每月",quarterly:"每季"};
const fmt=v=>v?new Date(v).toLocaleDateString("zh-TW"):"—";
const fmtPrice=v=>Number.isFinite(+v)?(+v).toFixed(2):"—";
async function init(){
 if(!SYMBOL) throw new Error("Missing symbol");
 const d=await fetch("../data/stocks/"+encodeURIComponent(SYMBOL)+".json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("Stock data unavailable");return r.json()});
 document.title=SYMBOL+" · Serenity Research"; symbol.textContent=SYMBOL;
 const s=d.summary||{}; stance.textContent=s.latest_sentiment||"Neutral"; stance.className="sentiment "+(s.latest_sentiment||"Neutral");
 metrics.innerHTML=`<div>Primary<b>${s.primary_count||0}</b></div><div>Replies context<b>${s.reply_count||0}</b></div><div>First mention<b>${fmt(s.first_mentioned_at)}</b></div>`;
 thesis.textContent=s.latest_thesis||"尚無 AI thesis。";
 renderPerf(d.performance||{}); renderChart(d.performance||{},d.daily_stances||[]);
 posts.innerHTML=renderRows(d.primary_posts||[]);
 replies.innerHTML=renderRows(d.reply_context||[]);
}
function renderRows(rows){return rows.map(x=>`<div class="post-row"><div class="small">${fmt(x.created_at)} · ${esc(x.sentiment||"Neutral")} · ★${x.importance||1}</div><p>${esc(x.summary_zh||x.core_thesis||x.text||"")}</p><a href="${esc(x.url)}" target="_blank" rel="noopener">原文 ↗</a></div>`).join("")||`<div class="muted">沒有資料。</div>`}
function renderPerf(p){
 const h=((p.summary||{}).horizons)||{};
 const one=k=>{const x=h[k]||{};return `<div><span class="small">${k.toUpperCase()}</span><br><strong>${x.hit_rate==null?"—":x.hit_rate+"%"}</strong><br><span class="small">n=${x.sample||0} · avg ${x.avg_score_return==null?"—":x.avg_score_return+"%"}</span></div>`}
 performance.innerHTML=`<div class="metrics">${one("7d")}${one("30d")}${one("now")}</div>`;
}
function renderChart(p,stances){
 const svg=document.querySelector("#chart"), meta=document.querySelector("#chartMeta");
 const all=(((p.price||{}).points)||[])
   .filter(x=>x&&x.date&&Number.isFinite(+x.close))
   .slice()
   .sort((a,b)=>String(a.date).localeCompare(String(b.date)));

 if(!all.length){
   meta.textContent=`${PERIOD_LABEL[PERIOD]} · 無價格資料`;
   svg.innerHTML='<text x="40" y="70" fill="#85877f">Price data unavailable</text>';
   return;
 }

 // 價格曲線跟首頁選到的 period 同步；不新增第二套 range UI。
 const latest=all[all.length-1].date;
 const end=new Date(latest+"T12:00:00Z");
 const start=new Date(end);
 start.setUTCDate(start.getUTCDate()-(PERIOD_DAYS[PERIOD]-1));
 const startKey=start.toISOString().slice(0,10);
 const points=all.filter(x=>x.date>=startKey&&x.date<=latest);

 const first=+points[0].close, last=+points[points.length-1].close;
 const change=first?((last/first)-1)*100:null;
 meta.textContent=`${PERIOD_LABEL[PERIOD]} · ${fmt(points[0].date)} ～ ${fmt(points[points.length-1].date)} · 最新 $${fmtPrice(last)}${change==null?"":` · 區間 ${(change>=0?"+":"")}${change.toFixed(2)}%`}`;

 const W=1000,H=340,L=62,R=24,T=22,B=42;

 // daily 只有一個交易日時仍顯示日期、價格與 signal，不再報 unavailable。
 if(points.length===1){
   const pt=points[0], s=stances.find(x=>x.date===pt.date);
   let c="#9a8465"; if(s?.sentiment==="Bullish")c="#718370"; if(s?.sentiment==="Bearish")c="#a35e52";
   svg.innerHTML=`
     <line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#ded8ca" stroke-width="1"/>
     <circle cx="${(L+W-R)/2}" cy="${(T+H-B)/2}" r="7" fill="${c}" stroke="#f7f4ed" stroke-width="3">
       <title>${esc(pt.date+" · $"+fmtPrice(pt.close)+(s?" · "+s.sentiment:""))}</title>
     </circle>
     <text x="${L}" y="${T+4}" fill="#85877f" font-size="13">$${fmtPrice(pt.close)}</text>
     <text x="${(L+W-R)/2}" y="${H-12}" text-anchor="middle" fill="#85877f" font-size="13">${esc(fmt(pt.date))}</text>`;
   return;
 }

 const vals=points.map(x=>+x.close), rawMin=Math.min(...vals),rawMax=Math.max(...vals), rawSpan=rawMax-rawMin||1;
 const min=rawMin-rawSpan*.06, max=rawMax+rawSpan*.06, span=max-min||1;
 const xy=(pt,i)=>[
   L+i/(points.length-1)*(W-L-R),
   H-B-(+pt.close-min)/span*(H-T-B)
 ];

 let html="";

 // Y 軸價格
 for(let i=0;i<5;i++){
   const value=max-(span*i/4), y=T+i*(H-T-B)/4;
   html+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#e3ded2" stroke-width="1"/>`;
   html+=`<text x="${L-8}" y="${y+4}" text-anchor="end" fill="#85877f" font-size="12">$${fmtPrice(value)}</text>`;
 }

 // X 軸日期
 const tickCount=Math.min(5,points.length);
 for(let k=0;k<tickCount;k++){
   const i=Math.round(k*(points.length-1)/(tickCount-1));
   const [x]=xy(points[i],i);
   html+=`<text x="${x}" y="${H-12}" text-anchor="middle" fill="#85877f" font-size="12">${esc(fmt(points[i].date))}</text>`;
 }

 const line=points.map((pt,i)=>{const [x,y]=xy(pt,i);return `${i?"L":"M"}${x.toFixed(1)},${y.toFixed(1)}`}).join(" ");
 html+=`<path d="${line}" fill="none" stroke="#718370" stroke-width="3" vector-effect="non-scaling-stroke"/>`;

 const byDate=Object.fromEntries(stances.map(s=>[s.date,s]));
 points.forEach((pt,i)=>{
   const [x,y]=xy(pt,i), s=byDate[pt.date];
   // 每個價格點都有 hover 日期/價格；Primary signal 點才上色顯示。
   html+=`<circle cx="${x}" cy="${y}" r="10" fill="transparent"><title>${esc(pt.date+" · $"+fmtPrice(pt.close)+(s?" · "+s.sentiment:""))}</title></circle>`;
   if(!s)return;
   let c="#9a8465"; if(s.sentiment==="Bullish")c="#718370"; if(s.sentiment==="Bearish")c="#a35e52";
   html+=`<circle cx="${x}" cy="${y}" r="6" fill="${c}" stroke="#f7f4ed" stroke-width="3"><title>${esc(pt.date+" · $"+fmtPrice(pt.close)+" · "+s.sentiment+" · "+(s.mention_count||1)+" mentions")}</title></circle>`;
 });
 svg.innerHTML=html;
}
init().catch(e=>document.querySelector("main").innerHTML+=`<p>${esc(e.message)}</p>`);
</script></body></html>
